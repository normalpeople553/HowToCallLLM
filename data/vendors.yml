# 四家厂商结构化对照数据（v0.1）
# 价格单位：元 / 百万 tokens；核对日期：2026-10-13
# 易变字段（价格/模型名/免费额度）以官方文档为准，更新时请同步修改本表与对应攻略页。

meta:
  version: "0.1"
  scope: "文本大模型对话调用"
  verified_at: "2026-10-13"
  currency: "CNY"
  price_unit: "元/百万tokens"

vendors:
  - id: deepseek
    name: "DeepSeek"
    platform: "https://platform.deepseek.com/"
    docs: "https://api-docs.deepseek.com/zh-cn/"
    pricing: "https://api-docs.deepseek.com/zh-cn/quick_start/pricing"
    base_url: "https://api.deepseek.com"
    key_env: "DEEPSEEK_API_KEY"
    models:
      - name: "deepseek-v4-flash"
        role: "日常首选，默认思考"
        context: "1M"
        input: 1
        input_cache_hit: 0.02
        output: 2
        recommended: true
      - name: "deepseek-v4-pro"
        role: "高难任务旗舰"
        context: "1M"
        input: 3
        input_cache_hit: 0.025
        output: 6
    free_quota: "新用户赠送余额（先扣赠送再扣充值）"
    notes:
      - "deepseek-chat / deepseek-reasoner 旧名已于 2026-07-24 弃用，映射到 v4-flash"
      - "国内直连，无需代理"

  - id: kimi
    name: "Kimi（月之暗面）"
    platform: "https://platform.moonshot.cn/"
    docs: "https://platform.kimi.com/docs"
    pricing: "https://platform.kimi.com/docs/pricing/chat-v1"
    base_url: "https://api.moonshot.cn/v1"
    key_env: "MOONSHOT_API_KEY"
    models:
      - name: "moonshot-v1-8k"
        role: "短问答，最便宜"
        context: "8K"
        input: 2
        output: 10
        recommended: true
      - name: "moonshot-v1-32k"
        role: "中等长度材料"
        context: "32K"
        input: 5
        output: 20
      - name: "moonshot-v1-128k"
        role: "超长文档"
        context: "128K"
        input: 10
        output: 30
    free_quota: "以平台当期活动为准"
    notes:
      - "模型名必须带上下文后缀，moonshot-v1 单独写无效"
      - "国内用 .cn，海外 .ai 的 key 不通用"

  - id: zhipu
    name: "智谱 GLM"
    platform: "https://bigmodel.cn/"
    docs: "https://docs.bigmodel.cn/cn/"
    pricing: "https://docs.bigmodel.cn/cn/guide/start/pricing"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    key_env: "ZHIPU_API_KEY"
    models:
      - name: "glm-4.7-flash"
        role: "长期免费，练手首选"
        context: "200K"
        input: 0
        output: 0
        free: true
        recommended: true
      - name: "glm-z1-flash"
        role: "免费推理模型"
        context: "128K"
        input: 0
        output: 0
        free: true
      - name: "glm-5.3-flash"
        role: "新一代高性价比多模态"
        context: "1M"
        input: 0.8
        output: 2.8
      - name: "glm-5.3"
        role: "当前旗舰"
        context: "1M"
        input: 8
        output: 28
    free_quota: "GLM-4-Flash 系列长期免费（需实名）"
    notes:
      - "代码里模型名用小写"
      - "免费模型有 RPM/TPM 限流"
      - "国际版 api.z.ai 与国内 key 不通用"

  - id: qwen
    name: "通义千问（阿里云百炼）"
    platform: "https://bailian.console.aliyun.com/"
    docs: "https://help.aliyun.com/zh/model-studio/"
    pricing: "https://help.aliyun.com/zh/model-studio/model-pricing"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    key_env: "DASHSCOPE_API_KEY"
    models:
      - name: "qwen-flash"
        role: "快、便宜，别名自动跟随稳定版"
        recommended: true
      - name: "qwen3.6-flash"
        role: "锁定版本的 Flash"
      - name: "qwen-plus"
        role: "质量成本均衡（别名）"
      - name: "qwen-max"
        role: "旗舰（别名）"
      - name: "qwen-long"
        role: "超长文本"
    free_quota: "新用户免费额度（有有效期、可能限地域）"
    notes:
      - "base_url 的 /compatible-mode/v1 不能漏"
      - "需阿里云实名并在控制台开通模型"
      - "可开启仅免费额度模式，用完即停"
