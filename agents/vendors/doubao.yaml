# 豆包（火山方舟）调用卡（AI 速查）— 实测 2026-10-13 ✅
vendor: doubao
name: "豆包 / 火山引擎方舟 Ark"
verified_at: "2026-10-13"
key:
  env: ARK_API_KEY
  apply_url: "https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey"
  steps: "注册火山引擎 → 个人实名认证 → 开通方舟 → 先开通模型 → 创建 API Key"
  activate_models_url: "https://console.volcengine.com/ark/region:ark+cn-beijing/openManagement"
  free_quota: "新用户免费推理试用额度：注册即得，不同模型分别计算"
  free_quota_url: "https://docs.volcengine.com/docs/ark/free-inference-quota?lang=zh"
api:
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  openai_compatible: true
  protocol_note: "也可用官方 volcengine-python-sdk[ark]，但 openai 库即可"
models:  # 均为带日期戳的 Model ID 直调；也可建推理接入点用 ep-xxx
  - id: "doubao-seed-2-1-pro-260628"
    role: "生产级旗舰，编程/Agent/多模态"
    context: "256K"
    default_thinking: true
    price_cny_per_mtok: { input: 6, output: 30 }
    verified: true
  - id: "doubao-seed-2-1-turbo-260628"
    role: "速度档"
    default_thinking: true
    verified: true
  - id: "doubao-seed-2-1-lite-260915"
    role: "轻量便宜档"
    default_thinking: true
    verified: true
thinking:
  field: 'extra_body={"thinking": {"type": "disabled"}}'
  default: enabled
  reasoning_field: "message.reasoning_content"
  verified_off: true
gotchas:
  - "调用前必须先在『开通管理』开通对应模型，未开通返回 404 InvalidEndpointOrModel.NotFound"
  - "模型名带版本日期戳（-260628），新版发布后旧日期可能下线，以模型广场当前 Model ID 为准"
  - "方舟还托管 deepseek/kimi/glm 等第三方模型，同样需逐个开通"
docs:
  pricing: "https://docs.volcengine.com/docs/ark/model-pricing?lang=zh"
  quickstart: "https://www.volcengine.com/docs/82379/1399008"
snippet: "../snippets/doubao.py"
